<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #0b0d13;
    color: #f1f5f9;
    width: 320px;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid #1e2433;
  }
  .logo-box {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #00e599 0%, #00b377 100%);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #05070a;
    box-shadow: 0 4px 12px rgba(0, 229, 153, 0.25);
    flex-shrink: 0;
  }
  .app-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #f8fafc;
  }
  .app-sub {
    font-size: 11px;
    color: #64748b;
    font-weight: 500;
    margin-top: 1px;
  }

  /* ── Connection Status ── */
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 10px;
    background: #131722;
    border: 1px solid #202738;
    margin-bottom: 14px;
    font-size: 12px;
    transition: all 0.2s ease;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.connected {
    background: #00e599;
    box-shadow: 0 0 8px rgba(0, 229, 153, 0.7);
  }
  .dot.disconnected {
    background: #f43f5e;
    box-shadow: 0 0 6px rgba(244, 63, 94, 0.5);
  }
  .dot.checking {
    background: #f59e0b;
    animation: pulse 1.2s ease infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .status-text {
    color: #94a3b8;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-text b {
    color: #f1f5f9;
    font-weight: 600;
  }

  /* ── Current Page Card ── */
  .page-card {
    background: #131722;
    border: 1px solid #202738;
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-label {
    font-size: 10px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .page-title {
    font-size: 12.5px;
    font-weight: 600;
    color: #e2e8f0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .page-url {
    font-size: 11px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    color: #828fa3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge-row {
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2.5px 8px;
    border-radius: 99px;
  }
  .badge.supported {
    background: rgba(0, 229, 153, 0.12);
    color: #00e599;
    border: 1px solid rgba(0, 229, 153, 0.25);
  }
  .badge.generic {
    background: rgba(148, 163, 184, 0.1);
    color: #94a3b8;
    border: 1px solid rgba(148, 163, 184, 0.18);
  }

  /* ── Send Button ── */
  .btn-send {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #00e599 0%, #00b377 100%);
    color: #05070a;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.15s ease;
    box-shadow: 0 4px 14px rgba(0, 229, 153, 0.22);
    font-family: inherit;
    letter-spacing: -0.01em;
  }
  .btn-send:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 229, 153, 0.35);
    background: linear-gradient(135deg, #0fe8a0 0%, #00c482 100%);
  }
  .btn-send:active:not(:disabled) {
    transform: translateY(0);
  }
  .btn-send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-send.success {
    background: rgba(0, 229, 153, 0.15);
    color: #00e599;
    border: 1px solid rgba(0, 229, 153, 0.4);
    box-shadow: none;
  }
  .btn-send.error {
    background: rgba(244, 63, 94, 0.15);
    color: #f43f5e;
    border: 1px solid rgba(244, 63, 94, 0.4);
    box-shadow: none;
  }

  /* ── Footer ── */
  .footer {
    margin-top: 13px;
    font-size: 11px;
    color: #64748b;
    text-align: center;
    line-height: 1.45;
  }
  .footer b {
    color: #94a3b8;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-box">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2v8M4 7l4 4 4-4"/>
      <rect x="2.5" y="13" width="11" height="1.5" rx=".75" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div>
    <div class="app-name">Media Downloader</div>
    <div class="app-sub">v0.3.0 · Companion Extension</div>
  </div>
</div>

<!-- connection status -->
<div class="status-row">
  <div class="dot checking" id="dot"></div>
  <span class="status-text" id="status-text">Checking desktop app…</span>
</div>

<!-- current page card -->
<div class="page-card">
  <div class="card-label">Current Page</div>
  <div class="page-title" id="page-title">—</div>
  <div class="page-url" id="page-url">—</div>
  <div class="badge-row" id="badge-wrap"></div>
</div>

<!-- send button -->
<button class="btn-send" id="btn-send" disabled>
  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2v8M4 7l4 4 4-4"/>
    <rect x="2.5" y="13" width="11" height="1.5" rx=".75" fill="currentColor" stroke="none"/>
  </svg>
  <span id="btn-label">Send to Downloader</span>
</button>

<div class="footer">
  <b>Tip:</b> Right-click any link, video, audio, or image to download directly.
</div>

<script>
// Known site engine routing
const YTDLP_HOSTS = [
  "youtube.com", "youtu.be", "vimeo.com", "tiktok.com",
  "twitch.tv", "dailymotion.com", "bilibili.com", "soundcloud.com",
  "bandcamp.com", "facebook.com", "fb.watch", "pornhub.com",
  "xvideos.com", "xhamster.com", "xnxx.com", "spankbang.com", "1flex.org"
];

const GALLERY_HOSTS = [
  "redgifs.com", "reddit.com", "imgur.com", "twitter.com", "x.com",
  "instagram.com", "pixiv.net", "tumblr.com", "flickr.com",
  "deviantart.com", "pinterest.com", "cyberdrop.me", "erome.com",
  "e621.net", "gelbooru.com", "rule34.xxx", "danbooru.donmai.us",
  "kemono.party", "kemono.su", "coomer.party", "coomer.su", "artstation.com"
];

function detectTool(url) {
  try {
    const h = new URL(url).hostname.replace(/^www\./, "").toLowerCase();
    for (const s of GALLERY_HOSTS) {
      if (h.includes(s)) return "gallery-dl";
    }
    for (const s of YTDLP_HOSTS) {
      if (h.includes(s)) return "yt-dlp";
    }
  } catch {}
  return null;
}

const dot        = document.getElementById("dot");
const statusText = document.getElementById("status-text");
const pageTitle  = document.getElementById("page-title");
const pageUrl    = document.getElementById("page-url");
const badgeWrap  = document.getElementById("badge-wrap");
const btnSend    = document.getElementById("btn-send");
const btnLabel   = document.getElementById("btn-label");

let currentUrl   = "";
let currentTitle = "";
let appRunning   = false;
let toolDetected = null;

async function init() {
  // Query active tab
  try {
    const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
    if (tab?.url) {
      currentUrl = tab.url;
      currentTitle = tab.title || "Web Page";
      pageTitle.textContent = currentTitle;

      const display = currentUrl.replace(/^https?:\/\/(www\.)?/, "");
      pageUrl.textContent = display.length > 40 ? display.slice(0, 40) + "…" : display;
      toolDetected = detectTool(currentUrl);

      if (toolDetected) {
        badgeWrap.innerHTML = `<span class="badge supported">✓ Supported · ${toolDetected}</span>`;
      } else if (currentUrl.startsWith("http")) {
        badgeWrap.innerHTML = `<span class="badge generic">Media Page · Auto-detect</span>`;
      }
    }
  } catch (err) {
    pageTitle.textContent = "Unable to read tab";
  }

  // Check desktop app connection
  try {
    const res = await chrome.runtime.sendMessage({ type: "CHECK_APP" });
    appRunning = res?.running ?? false;
  } catch {
    appRunning = false;
  }

  if (appRunning) {
    dot.className = "dot connected";
    statusText.innerHTML = "<b>App connected</b> · Port 6789";
    if (currentUrl.startsWith("http")) {
      btnSend.disabled = false;
    }
  } else {
    dot.className = "dot disconnected";
    statusText.innerHTML = "App offline — <b>open Media Downloader</b>";
  }
}

btnSend.addEventListener("click", async () => {
  if (!currentUrl || !appRunning) return;
  btnSend.disabled = true;
  btnLabel.textContent = "Sending…";

  const res = await chrome.runtime.sendMessage({
    type:  "SEND_URL",
    url:   currentUrl,
    title: currentTitle,
  });

  if (res?.ok) {
    btnSend.classList.add("success");
    btnLabel.textContent = "Sent to Queue ✓";
    setTimeout(() => {
      btnSend.classList.remove("success");
      btnLabel.textContent = "Send to Downloader";
      btnSend.disabled = false;
    }, 2000);
  } else {
    btnSend.classList.add("error");
    btnLabel.textContent = "Failed — App Offline";
    setTimeout(() => {
      btnSend.classList.remove("error");
      btnLabel.textContent = "Send to Downloader";
      btnSend.disabled = false;
    }, 3000);
  }
});

init();
</script>
</body>
</html>
